<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12634a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Duitku" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Duitku</title>
    <link rel="preconnect" href="https://script.google.com" />
    <style>
      /* layar pembuka: tampil seketika sebelum aplikasi siap, supaya tidak terlihat macet */
      html, body { margin: 0; background: #f5f6f4; }
      .splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; font-family: system-ui, sans-serif; color: #5b665f; }
      .splash b { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #1a7a5a, #0d4d38); color: #fff; font-size: 34px; display: grid; place-content: center; }
      .splash i { width: 22px; height: 22px; border: 3px solid #cfd8d2; border-top-color: #12634a; border-radius: 50%; animation: pt .8s linear infinite; }
      @keyframes pt { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body><div id="root"><div class="splash" role="status" aria-label="Memuat"><b>D</b><i></i><span>Memuat Duitku…</span></div></div><script type="module" src="/src/main.jsx"></script></body>
</html>

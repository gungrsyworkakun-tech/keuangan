<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12634a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Duitku" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Duitku</title>
    <link rel="preconnect" href="https://script.google.com" />
    <style>
      /* layar pembuka: tampil seketika sebelum aplikasi siap, supaya tidak terlihat macet */
      html, body { margin: 0; background: #f5f6f4; }
      .splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; font-family: system-ui, sans-serif; color: #5b665f; }
      .splash b { width: 88px; height: 88px; border-radius: 24px; background: linear-gradient(135deg, #1a7a5a, #0d4d38); color: #fff; font-size: 48px; display: grid; place-content: center; }
      .splash b { animation: pop .55s cubic-bezier(.2,1.3,.4,1) both, ambang 2.4s ease-in-out .6s infinite; box-shadow: 0 10px 30px rgba(18,99,74,.28); }
      .splash .prog { animation: naik .5s ease .25s both; }
      @keyframes pop { from { transform: scale(.4) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes ambang { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes naik { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .splash b, .splash .prog { animation: none; } }
      .prog { width: min(300px, 80vw); display: grid; gap: 8px; }
      .prog .bar { height: 8px; border-radius: 99px; background: #dde3df; overflow: hidden; }
      .prog .bar em { display: block; height: 100%; width: 5%; border-radius: 99px; background: linear-gradient(90deg, #1a7a5a, #12634a); transition: width .35s ease; }
      .prog .row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
      .prog .row span { flex: 1; min-width: 0; }
      .prog .row strong { color: #12634a; font-variant-numeric: tabular-nums; }
      .prog .row small { color: #8a948d; font-variant-numeric: tabular-nums; }
      .prog p { margin: 0; font-size: 12px; color: #a0620d; text-align: center; }
    </style>
  </head>
  <body><div id="root"><div class="splash" role="status" aria-label="Memuat"><b>D</b><div class="prog" id="prog"><div class="bar"><em></em></div><div class="row"><span>Menghubungi server…</span><strong>5%</strong><small>0 dtk</small></div><p hidden>Koneksi sedang lambat, mohon tunggu sebentar…</p></div></div></div><script src="./progres.js"></script><script type="module" src="/src/main.jsx"></script></body>
</html>

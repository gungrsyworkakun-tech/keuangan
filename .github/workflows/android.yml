name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [aplikasi-android]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Terima lisensi Android SDK (SDK sudah ada di mesin GitHub)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm test
      - name: Build web (mode aplikasi)
        run: npm run build:app
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - run: npx cap sync android
      - name: Nomor versi
        run: echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: APK percobaan (debug)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Siapkan kunci tanda tangan
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/duitku.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/duitku.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: AAB untuk Play Store
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: duitku-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Taruh APK di halaman Releases (supaya bisa diunduh langsung dari HP)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Duitku.apk
          gh release delete apk-terbaru --yes --cleanup-tag || true
          gh release create apk-terbaru Duitku.apk --prerelease --target "$GITHUB_SHA" \
            --title "Duitku APK terbaru" --notes "APK percobaan (build #${{ github.run_number }}). Unduh Duitku.apk lalu pasang di HP Android."
